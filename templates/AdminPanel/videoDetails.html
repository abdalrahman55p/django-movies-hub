{% extends 'AdminPanel/base.html' %}
{% block content %}

<div class="main-content">
    <div class="main-content-inner">
        <div class="main-content-wrap">
            <div class="flex items-center flex-wrap justify-between gap20 mb-30">
                <h3>Video Details </h3>
                <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                    <li>
                        <a href="{% url 'adminHome' %}">
                            <div class="text-tiny">Dashboard</div>
                        </a>
                    </li>
                    <li><i class="icon-chevron-right"></i></li>
                    <li>
                        <a href="{% url 'videosList' %}" role="button">
                            <div class="text-tiny">Videos</div>
                        </a>
                    </li>
                    <li><i class="icon-chevron-right"></i></li>
                    <li>
                        <div class="text-tiny">{{ video.title }}</div>
                    </li>
                </ul>
            </div>

            <div class="wg-box mb-30">
                {% if video.poster %}
                    <div class="mb-20">
                        <img src="{{ video.poster.url }}" alt="{{ video.title }}" style="max-width:200px;">
                    </div>
                {% endif %}

                {% if video.video %}
                    <div class="mb-20">
                        <video src="{{ video.video.url }}" controls style="max-width:400px;"></video>
                        
                    </div>
                    
                {% endif %}

                <fieldset class="name">
                    <div class="body-title">Video title</div>
                    <input type="text" class="form-control" value="{{ video.title }}" disabled>
                </fieldset>

        

                <fieldset class="name">
                    <div class="body-title">Description</div>
                    <textarea class="form-control" rows="3" disabled>{{ video.description }}</textarea>
                </fieldset>

                <fieldset class="name">
                    <div class="body-title">Type</div>
                    <input type="text" class="form-control" value="{{ video.itemType }}" disabled>
                </fieldset>

                <fieldset class="name">
                    <div class="body-title">Category</div>
                    <input type="text" class="form-control" value="{{ video.itemCategory }}" disabled>
                </fieldset>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
