{% extends 'AdminPanel/base.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">

      <div class="card shadow border-0 rounded-3 bg-dark text-white">
        <div class="card-body p-3">
          <h4 class="text-center mb-3 fw-semibold" style="font-size: 1rem;">➕ Add New Series</h4>

          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-danger w-100 mt-2 py-1" style="font-size: 0.85rem;">Add Series</button>
          </form>

          <div class="text-center mt-2">
            <a href="{% url 'series' %}" class="text-secondary" style="font-size: 0.75rem;">⬅ Back to Series List</a>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<style>
  body {
    background-color: #0b0b0b;
    color: #fff;
    font-family: 'Poppins', sans-serif;
  }

  .card input,
  .card select,
  .card textarea {
    background-color: #1a1a1a;
    color: #fff;
    border: 1px solid #333;
    font-size: 0.8rem;
  }

  .card input:focus,
  .card select:focus,
  .card textarea:focus {
    border-color: #e50914;
    outline: none;
  }

  .btn-danger {
    background-color: #e50914;
    border: none;
    font-size: 0.85rem;
  }

  .btn-danger:hover {
    background-color: #f6121d;
  }

  a.text-secondary:hover {
    color: #e50914 !important;
  }
</style>
{% endblock %}
