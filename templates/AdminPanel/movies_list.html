{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4 text-center">All Movies</h2>
  <div class="row">
    {% for movie in movies %}
      <div class="col-md-3 col-sm-6">
        <div class="card mb-4 shadow-sm h-100">
        
          <img src="{{ movie.poster.url|default:'/static/images/no-image.jpg' }}" 
               class="card-img-top" 
               alt="{{ movie.title }}"
               style="height: 300px; object-fit: cover;">

         
          <div class="card-body d-flex flex-column">
            <h5 class="card-title text-center">{{ movie.title }}</h5>
            
       
            <p class="text-muted text-center mb-1">
              {{ movie.year }}
            </p>
            
            <!-- التقييم -->
            <p class="text-center mb-2">
              ⭐ {{ movie.rating }}/10
            </p>

            <!-- زرار التفاصيل -->
            <div class="mt-auto text-center">
              <a href="{% url 'movie_detail' movie.id %}" class="btn btn-primary btn-sm">
                View Details
              </a>
            </div>
          </div>
        </div>
      </div>
    {% empty %}
      <p class="text-muted text-center">No movies available.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
