{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard | Aflam Studio{% endblock %}</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
  body {
    background: radial-gradient(circle at 20% 20%, #000000 0%, #1a1a1a 50%, #000000 100%);
    color: #fff;
    font-family: "Poppins", "Segoe UI", sans-serif;
    transition: all 0.3s ease;
  }

  /* 🌞 Light Mode */
  body.light-mode {
    background: #f4f4f4;
    color: #222;
  }

  /* 🔝 Navbar */
  .navbar {
    backdrop-filter: blur(10px);
    background: rgba(0, 0, 0, 0.6);
    border-bottom: 1px solid rgba(229, 9, 20, 0.4);
    transition: all 0.3s ease;
  }
  body.light-mode .navbar {
    background: rgba(255, 255, 255, 0.8);
    border-bottom: 1px solid rgba(0, 0, 0, 0.1);
  }

  .navbar-brand {
    color: #e50914 !important;
    font-weight: 700;
    font-size: 1.5rem;
  }

  /* 📁 Sidebar */
  .sidebar {
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(20px);
    border-right: 1px solid rgba(229, 9, 20, 0.3);
    min-height: 100vh;
    padding-top: 40px;
    transition: all 0.3s ease;
  }
  body.light-mode .sidebar {
    background: rgba(255, 255, 255, 0.8);
    border-right: 1px solid rgba(0, 0, 0, 0.1);
  }

  .sidebar a {
    display: block;
    color: #ccc;
    text-decoration: none;
    padding: 12px 25px;
    margin: 6px 15px;
    border-radius: 10px;
    transition: all 0.3s ease;
  }
  .sidebar a:hover {
    background: rgba(229, 9, 20, 0.3);
    color: #fff;
    transform: translateX(5px);
  }
  body.light-mode .sidebar a {
    color: #333;
  }
  body.light-mode .sidebar a:hover {
    background: rgba(229, 9, 20, 0.1);
    color: #000;
  }

  .sidebar .active {
    background: none;
    color: inherit;
    font-weight: normal;
    box-shadow: none;
  }

  /* 📄 المحتوى */
  .content {
    padding: 50px;
    background: rgba(15, 15, 15, 0.6);
    backdrop-filter: blur(10px);
    border-radius: 20px 0 0 20px;
    box-shadow: inset 0 0 40px rgba(229, 9, 20, 0.15);
    transition: all 0.3s ease;
  }
  body.light-mode .content {
    background: rgba(255, 255, 255, 0.7);
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
  }

  .card {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 30px rgba(229, 9, 20, 0.3);
  }
  body.light-mode .card {
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid rgba(0, 0, 0, 0.1);
  }

  .btn {
    background: linear-gradient(90deg, #e50914, #b00610);
    border: none;
    color: #fff !important;
    border-radius: 8px;
    transition: transform 0.2s ease;
  }
  .btn:hover {
    transform: scale(1.05);
  }

  .mode-toggle {
    cursor: pointer;
    font-size: 1.4rem;
    margin-left: 15px;
    color: #e50914;
    transition: transform 0.2s ease;
  }
  .mode-toggle:hover {
    transform: rotate(20deg);
  }
  </style>
</head>

<body>
  <!-- 🔝 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark px-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'adminHome' %}">
        <i class="bi bi-camera-reels me-2"></i>Aflam Studio
      </a>

      <!-- 🌙 زر التبديل بين الوضعين -->
      <i class="bi bi-moon-fill mode-toggle" id="modeToggle"></i>
    </div>
  </nav>

  <div class="d-flex">
    <!-- 📁 Sidebar -->
    <div class="sidebar">
      <a href="{% url 'adminHome' %}" class="active"><i class="bi bi-house-door me-2"></i> Dashboard</a>
      <a href="{% url 'videosList' %}"><i class="bi bi-film me-2"></i> Videos</a>
      <a href="{% url 'newVideoItem' %}"><i class="bi bi-plus-square me-2"></i> Add New Videos</a>
      <a href="{% url 'series' %}"><i class="bi bi-collection-play me-2"></i> Series</a>
      <a href="{% url 'add_series' %}"><i class="bi bi-plus-square me-2"></i> New Series</a>
      <a href="{% url 'settings_page' %}"><i class="bi bi-gear me-2"></i> Settings</a>
    </div>

    <div class="flex-grow-1 content">
      {% block content %}
      <h1 class="mb-5 text-center fw-bold" style="color:#e50914;">🎬 Welcome to Aflam Studio</h1>
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card p-4 text-center">
            <h5>Total Videos</h5>
            <h2>6</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-4 text-center">
            <h5>Categories</h5>
            <h2>6</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-4 text-center">
            <h5>Series</h5>
            <h2>6</h2>
          </div>
        </div>
      </div>
      {% endblock %}
    </div>
  </div>

  <script>
    const toggle = document.getElementById('modeToggle');
    const body = document.body;

    // ✅ تحميل الوضع المحفوظ
    if (localStorage.getItem('theme') === 'light') {
      body.classList.add('light-mode');
      toggle.classList.replace('bi-moon-fill', 'bi-sun-fill');
    }

    toggle.addEventListener('click', () => {
      body.classList.toggle('light-mode');
      const isLight = body.classList.contains('light-mode');
      toggle.classList.toggle('bi-sun-fill', isLight);
      toggle.classList.toggle('bi-moon-fill', !isLight);
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
  </script>
</body>
</html>
