{% extends 'AdminPanel/base.html' %}
{% load static %}

{% block content %}
<style>
  body {
    background-color: #0b0b0b;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 0.8rem;
  }

  .upload-container {
    max-width: 350px;
    margin: 25px auto;
    background: #141414;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 0 8px rgba(255, 0, 0, 0.25);
  }

  h2 {
    color: #e50914;
    font-weight: 600;
    text-align: center;
    margin-bottom: 10px;
    font-size: 0.9rem;
  }

  label {
    color: #ccc;
    font-size: 0.75rem;
    margin-top: 5px;
    display: block;
  }

  input, select, textarea {
    width: 100%;
    background-color: #1f1f1f;
    border: 1px solid #333;
    color: #fff;
    padding: 5px 7px;
    border-radius: 4px;
    margin-bottom: 7px;
    font-size: 0.75rem;
    transition: border 0.3s ease;
  }

  input:focus, select:focus, textarea:focus {
    border-color: #e50914;
    outline: none;
  }

  .btn-upload {
    background: #e50914;
    border: none;
    color: #fff;
    font-size: 0.8rem;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    width: 100%;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  .btn-upload:hover {
    background: #f40612;
    transform: scale(1.02);
  }

  .btn-upload:active {
    transform: scale(0.97);
  }

  .netflix-glow {
    box-shadow: 0 0 6px rgba(229, 9, 20, 0.3);
  }
</style>

<div class="upload-container netflix-glow">
  <h2>🎬 Add New Video</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-upload">Upload</button>
  </form>
</div>



{% endblock %}
